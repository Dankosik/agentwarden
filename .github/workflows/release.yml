name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Package (${{ matrix.target }})
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Read pinned toolchain
        id: rust
        run: python -c 'import os,tomllib; print("version=" + tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"], file=open(os.environ["GITHUB_OUTPUT"],"a"))'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-09-08
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: ${{ matrix.target }}
      - name: Validate tag and source identity
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/release.py check-tag --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"
      - run: cargo build --release --locked --target "$RELEASE_TARGET"
      - name: Package and smoke-test the extracted binary
        run: python scripts/release.py package --target "$RELEASE_TARGET" --dist dist
      - name: Attest build provenance of the archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish complete release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Read pinned toolchain
        id: rust
        run: python -c 'import os,tomllib; print("version=" + tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"], file=open(os.environ["GITHUB_OUTPUT"],"a"))'
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-09-08
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Validate source, complete artifact set, and notes
        run: |
          python scripts/release.py check-tag --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"
          python scripts/release.py checksums --dist dist
          python scripts/release.py notes > "$RUNNER_TEMP/notes.md"
      - name: Create release with every archive, checksum and the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            extra+=(--prerelease)
          fi
          # Assets go in while the release is a draft; publishing makes an
          # immutable release final.
          gh release create "$RELEASE_TAG" dist/* install.sh --repo "$RELEASE_REPOSITORY" --verify-tag --draft \
            --title "agentwarden $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md" "${extra[@]}"
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --draft=false

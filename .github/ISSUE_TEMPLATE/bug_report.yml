name: Bug report
description: agentwarden stopped something it should not have, missed something, or failed.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what you expected
      description: Include the command, its output, and exit status. For an unexpected stop, include the matching lines of ~/Library/Application Support/agentwarden/actions.jsonl.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: agentwarden status
      description: Output of `agentwarden status`. It lists executable names and PIDs, not command lines; remove anything private.
      render: text
  - type: input
    id: version
    attributes:
      label: Versions
      description: agentwarden --version, macOS version, Apple Silicon or Intel, Claude Code and Codex versions.
    validations:
      required: true

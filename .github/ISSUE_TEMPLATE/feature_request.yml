name: Feature request
description: A helper, agent, or situation agentwarden should handle.
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Which processes hold memory, which agent starts them, and when they are safe to stop.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Evidence and constraints
      description: Footprint numbers, how the agent behaves after the helper stops, and current workarounds.

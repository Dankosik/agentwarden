[package]
name = "agentwarden"
version = "0.1.3"
edition = "2024"
rust-version = "1.98.1"
description = "Resource governor for macOS workstations running parallel AI coding agents"
license = "MIT"
repository = "https://github.com/Dankosik/agentwarden"
publish = false

[dependencies]
# Shared CLI infrastructure.
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "4.6.9"
compact_str = { version = "0.10.0", default-features = false, features = ["serde", "std"] }
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = { version = "1.16.1", default-features = false, features = ["const_generics", "serde", "union"] }
thiserror = "2.0.20"
toml = { version = "1.1.5", default-features = false, features = ["parse", "serde", "std"] }

# Predeclared toolbox for common utility commands; see docs/library-guide.md.
anyhow = "1.0.104"
bstr = { version = "1.13.1", default-features = false, features = ["std"] }
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color"] }
globset = "0.4.20"
ignore = "0.4.33"
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
itertools = "0.15.0"
log = "0.4.34"
tempfile = "3.27.0"
walkdir = "2.5.0"

# Process signals, user IDs, and pipe polling on macOS; std has no safe API.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["poll", "signal", "user"] }

[dev-dependencies]
assert_cmd = "2.2.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
large_stack_frames = "warn"
needless_collect = "warn"
rc_buffer = "warn"
redundant_clone = "warn"
set_contains_or_insert = "warn"
suboptimal_flops = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
